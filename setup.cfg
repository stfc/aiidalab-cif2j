[aiidalab]
title = CIF2J
categories =
    quantum
    magnetism

[metadata]
name = aiidalab-cif2j
version = 0.1.0
author = Dr. Benjamin T. Speake
author_email = benjamin.speake@stfc.ac.uk
description = AiiDAlab UI for the aiida-cif2j plugin, computing magnetic exchange interactions from a CIF/MCIF structure via a Wannier90 + TB2J workflow.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/stfc/aiidalab-cif2j
project_urls =
    Logo = https://raw.githubusercontent.com/stfc/aiidalab-cif2j/refs/heads/main/images/cif2j.png
    Source = https://github.com/stfc/aiidalab-cif2j
    Bug Tracker = https://github.com/stfc/aiidalab-cif2j/issues
    Documentation = https://stfc.github.io/aiidalab-cif2j
classifiers =
    Framework :: AiiDA
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Development Status :: 3 - Alpha
license_file = LICENSE


[options]
package_dir =
    = src
packages = find:
install_requires =
    aiida-core>=2.6
    aiidalab-widgets-base
    aiida-cif2j>=0.0.1
    alc-aiidalab-widgets>=0.1.0
    aiida-quantumespresso
    weas-widget
    # aiida-wannier90 and aiida-wannier90-workflows are required by
    # aiida-cif2j's Wannier90+TB2J workflow but are not published on PyPI,
    # so they can't be declared here. This app's `post_install` script
    # installs them automatically via aiida-cif2j's own
    # `cif2j wannier90 install` command.

python_requires = >=3.10

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8.0
    pytest-cov>=6.0
    ruff>=0.11.0
    pre-commit

docs =
    sphinx>=8.0.2
    piccolo-theme>=0.14.0
    sphinx-toolbox
    numpydoc
